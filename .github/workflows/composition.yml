name: Composition invariants and released inference
on: [push, pull_request]
permissions:
  contents: read
jobs:
  heldout-combinations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python replay.py
      - run: python predict.py CBL CNN1 --output /tmp/composition.csv
      - run: python replication_replay.py
